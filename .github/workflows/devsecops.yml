
name: AWS DevSecOps Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ousl-project/ousl-project
        
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hungry_hub
          POSTGRES_USER: enterprisedb
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U enterprisedb -d hungry_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
            
      - name: Check Project Structure
        run: |
          echo "Current directory:"
          pwd
          echo "Files in repository:"
          ls -la
          echo "Finding pom.xml:"
          find . -name pom.xml
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: SonarCloud SAST scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DB_URL: jdbc:postgresql://localhost:5444/hungry_hub
          DB_USERNAME: enterprisedb
          DB_PASSWORD: ci_test_password
        run: |
          mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar \
          -Dsonar.projectKey=ousl-student-service \
          -Dsonar.organization=nuhasrifas97 \
          -Dsonar.host.url=https://sonarcloud.io
          
      - name: Show Test Failure Details
        if: always()
        run: |
          echo "===== TEST FAILURE REPORTS ====="
          find target/surefire-reports -type f
          echo "===== ERROR DETAILS ====="
          cat target/surefire-reports/*.txt
          
      - name: Build Container
        run: docker build -t ousl-student-api:${{ github.sha }} .

      - name: Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'ousl-student-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Container Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag ousl-student-api:${{ github.sha }} $ECR_REGISTRY/ousl-student-api:${{ github.sha }}
          docker push $ECR_REGISTRY/ousl-student-api:${{ github.sha }}
