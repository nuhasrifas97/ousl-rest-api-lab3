
spring:
  application:
    name: hungry-hub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5444/hungry_hub}
    username: ${DB_USERNAME:enterprisedb}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081
